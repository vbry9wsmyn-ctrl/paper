name: Compile IJPE manuscript

on:
  push:
    branches:
      - rewrite-compile-greenwash
      - claude/paper-review-j9zxzp
    paths:
      - "greenwash/**"
      - ".github/workflows/compile-greenwash.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out manuscript
        uses: actions/checkout@v4
      - name: Restore redrawn Figure 5(a)
        run: |
          encoded=greenwash/mathematica/out/fig51.pdf.b64
          if [ -f "$encoded" ]; then
            base64 --decode "$encoded" > /tmp/fig51-redrawn.pdf
            cp /tmp/fig51-redrawn.pdf greenwash/Figure/fig51.pdf
            cp /tmp/fig51-redrawn.pdf greenwash/mathematica/out/fig51.pdf
            rm "$encoded"
          fi
      - name: Compile PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main_IJPE.tex
          working_directory: greenwash
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Upload compiled PDF
        uses: actions/upload-artifact@v7
        with:
          name: main-IJPE-pdf
          path: greenwash/main_IJPE.pdf
          if-no-files-found: error
      - name: Write compiled PDF back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greenwash/main_IJPE.pdf greenwash/Figure/fig51.pdf greenwash/mathematica/out/fig51.pdf greenwash/mathematica/out/fig51.pdf.b64
          if git diff --cached --quiet; then
            echo "Compiled PDF is unchanged"
          else
            git commit -m "Compile rewritten IJPE manuscript"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
